name: Verificar Blindly

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar compatibilidad con Expo 57
        run: |
          npx expo install --check
          npx expo-doctor

      - name: Bloquear vulnerabilidades críticas
        run: npm audit --omit=dev --audit-level=critical

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Verificar ESLint
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Empaquetar web, Android e iOS
        run: npm run build:bundles
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://ci.supabase.co
          EXPO_PUBLIC_SUPABASE_KEY: public-ci-placeholder
          EXPO_PUBLIC_EMAIL_AUTH_READY: "false"
          EXPO_PUBLIC_PLUS_READY: "false"
